<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buñuelos Tech FLI</title>
  <meta name="description" content="Buñuelos Tech FLI — proyecto web." />
  <style>
    :root {
      --bg: #0f1220;
      --card: #171b2e;
      --text: #eef1ff;
      --muted: #9aa3c7;
      --accent: #ffb347;
      --accent-2: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 15% 0%, rgba(255, 179, 71, 0.18), transparent 60%),
        radial-gradient(700px 400px at 90% 100%, rgba(255, 107, 107, 0.16), transparent 60%),
        var(--bg);
    }

    main {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 48px 40px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(255, 179, 71, 0.35);
      background: rgba(255, 179, 71, 0.08);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.1;
      background: linear-gradient(100deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin: 0 auto 32px;
      max-width: 46ch;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    a.btn {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    a.btn:hover { transform: translateY(-2px); opacity: 0.9; }

    .primary {
      background: linear-gradient(100deg, var(--accent), var(--accent-2));
      color: #1b1205;
    }

    .ghost {
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--text);
    }

    footer {
      margin-top: 36px;
      font-size: 0.8rem;
      color: #6f7899;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Buñuelos Tech</span>
    <h1>Buñuelos Tech FLI</h1>
    <p>
      Bienvenido. Este es el punto de partida del proyecto. Edita este archivo
      para empezar a construir tu sitio.
    </p>
    <div class="actions">
      <a class="btn primary" href="https://github.com/BryanEscobar638/BunuelosTechFLI" target="_blank" rel="noopener">Ver repositorio</a>
      <a class="btn ghost" href="#contacto">Contacto</a>
    </div>
    <footer id="contacto">&copy; <span id="year"></span> Buñuelos Tech FLI</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
